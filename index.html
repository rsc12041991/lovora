<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovora</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #222;
    }

    .header {
      background: linear-gradient(135deg, #ff3d81, #8e44ff);
      color: white;
      padding: 20px;
      border-radius: 0 0 25px 25px;
    }

    .header h1 {
      font-size: 28px;
    }

    .header p {
      margin-top: 5px;
      opacity: 0.9;
    }

    .search {
      margin: 15px 0;
      background: white;
      padding: 12px;
      border-radius: 15px;
      color: #888;
    }

    .section {
      padding: 20px;
    }

    .section h2 {
      margin-bottom: 15px;
    }

    .live {
      display: flex;
      gap: 15px;
      overflow-x: auto;
    }

    .card {
      min-width: 130px;
      height: 170px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      display: flex;
      align-items: end;
      padding: 12px;
      font-weight: bold;
    }

    .card:nth-child(2) {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .card:nth-child(3) {
      background: linear-gradient(135deg, #11998e, #38ef7d);
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 16px;
      border-radius: 15px;
      background: white;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0 3px 10px #ddd;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      justify-content: space-around;
      padding: 15px 5px;
      box-shadow: 0 -3px 10px #ddd;
    }

    .bottom div {
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>❤️ Lovora</h1>
    <p>Connect • Chat • Go Live</p>

    <div class="search">
      🔍 Search people...
    </div>
  </div>

  <div class="section">
    <h2>🔴 Live Now</h2>

    <div class="live">
      <div class="card">👩 Priya<br>🔴 LIVE</div>
      <div class="card">👨 Rahul<br>🔴 LIVE</div>
      <div class="card">👩 Neha<br>🔴 LIVE</div>
    </div>

    <div class="buttons">
      <button>🎥 Go Live</button>
      <button>💬 Messages</button>
      <button>❤️ Discover</button>
      <button>👤 My Profile</button>
    </div>
  </div>

  <div class="bottom">
    <div>🏠<br>Home</div>
    <div>🔴<br>Live</div>
    <div>💬<br>Chat</div>
    <div>👤<br>Profile</div>
  </div>

</body>
</html>
