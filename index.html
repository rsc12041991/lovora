<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovora - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff3d81, #8e44ff);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 30px 22px;
      border-radius: 25px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      color: #ff3d81;
      margin-bottom: 8px;
    }

    .tagline {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .main-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff3d81, #8e44ff);
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #666;
    }

    .switch span {
      color: #8e44ff;
      font-weight: bold;
      cursor: pointer;
    }

    .social {
      margin-top: 20px;
      text-align: center;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">❤️ Lovora</div>

    <p class="tagline">
      Connect • Chat • Go Live
    </p>

    <h2 id="title">Login</h2>

    <input
      type="text"
      id="name"
      placeholder="आपका नाम"
      style="display:none;"
    >

    <input
      type="email"
      placeholder="Email"
    >

    <input
      type="password"
      placeholder="Password"
    >

    <button class="main-btn" id="mainBtn">
      Login
    </button>

    <p class="switch">
      <span id="switchText">
        Create New Account
      </span>
    </p>

    <p class="social">
      Lovora © 2026
    </p>

  </div>

  <script>

    let signup = false;

    const title = document.getElementById("title");
    const name = document.getElementById("name");
    const mainBtn = document.getElementById("mainBtn");
    const switchText = document.getElementById("switchText");

    switchText.onclick = function() {

      signup = !signup;

      if (signup) {
        title.innerText = "Create Account";
        name.style.display = "block";
        mainBtn.innerText = "Create Account";
        switchText.innerText = "Already have an account? Login";
      } else {
        title.innerText = "Login";
        name.style.display = "none";
        mainBtn.innerText = "Login";
        switchText.innerText = "Create New Account";
      }

    };

  </script>

</body>
</html>
